name: Build, Lint & Deploy Kubernetes

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-validate:
    name: Validate Docker & Kubernetes Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Run Flask Route Tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python tests/test_flask_app.py

      - name: Validate Kubernetes Manifests with Kustomize
        run: |
          kubectl kustomize k8s/ > /dev/null
          echo "Kustomize manifest compilation successful!"

  docker-build-push:
    name: Build & Push Container Image
    needs: lint-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            sanjaygl2006/agentportfolio:latest
            sanjaygl2006/agentportfolio:${{ github.sha }}
