
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sanjay-portfolio-hpa
  namespace: portfolio
  labels:
    app.kubernetes.io/name: sanjay-portfolio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sanjay-portfolio-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
