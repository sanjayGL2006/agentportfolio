apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanjay-portfolio-deployment
  namespace: portfolio
  labels:
    app.kubernetes.io/name: sanjay-portfolio
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: sanjay-aios
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sanjay-portfolio
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sanjay-portfolio
        app.kubernetes.io/name: sanjay-portfolio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: portfolio-backend
          image: sanjaygl2006/agentportfolio:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: sanjay-portfolio-config
            - secretRef:
                name: sanjay-portfolio-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
