# Default values for sanjay-portfolio Helm chart.

replicaCount: 2

image:
  repository: sanjaygl2006/agentportfolio
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 10001

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
  hosts:
    - host: portfolio.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

env:
  PORT: "5000"
  FLASK_ENV: "production"
  SUPABASE_URL: "https://mglzwnampheswtjzrcbf.supabase.co"

secrets:
  GEMINI_API_KEY: "your-gemini-api-key-here"
  SUPABASE_KEY: "sb_publishable_vuV_ZmS859v1QUhQHISoqg_nkN-DWFl"
  SUPABASE_SECRET_KEY: "your-supabase-secret-key-here"

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /app/database
