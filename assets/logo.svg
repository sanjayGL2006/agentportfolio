<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE79A"/>
      <stop offset="0.5" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <polygon points="60,4 110,32 110,88 60,116 10,88 10,32" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#glow)"/>
  <polygon points="60,16 99,38 99,82 60,104 21,82 21,38" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.45"/>
  <circle cx="60" cy="4" r="2.4" fill="#FFD700"/>
  <circle cx="110" cy="32" r="2.4" fill="#FFD700"/>
  <circle cx="110" cy="88" r="2.4" fill="#FFD700"/>
  <circle cx="60" cy="116" r="2.4" fill="#FFD700"/>
  <circle cx="10" cy="88" r="2.4" fill="#FFD700"/>
  <circle cx="10" cy="32" r="2.4" fill="#FFD700"/>
  <text x="60" y="70" text-anchor="middle" font-family="Poppins, sans-serif" font-weight="700" font-size="34" fill="url(#goldGrad)" filter="url(#glow)">GL</text>
  <line x1="60" y1="16" x2="60" y2="4" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
  <line x1="21" y1="38" x2="10" y2="32" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
  <line x1="99" y1="38" x2="110" y2="32" stroke="#FFD700" stroke-width="1" opacity="0.6"/>
</svg>
